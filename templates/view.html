{{define "view.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>{{.FileName}}</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            'plyr-color': '#3b82f6', // Customizes Plyr accent color to blue
          }
        }
      }
    };
  </script>

  <style>
    /* --- Glass & Soft UI Classes (Preserved for Nav) --- */
    .glass-dark {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .soft-btn { transition: all 0.2s; }
    .soft-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
    .soft-btn:active { transform: scale(0.95); }

    /* --- Custom Plyr Theme Overrides --- */
    :root {
        --plyr-color-main: #ffffff; /* White controls */
        --plyr-video-background: transparent;
    }
    
    /* Center the player */
    .plyr {
        width: 100%;
        max-height: 80vh;
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden relative font-sans flex flex-col">

  <nav class="absolute top-0 left-0 right-0 z-50 p-6 flex justify-between items-start pointer-events-none">
    <div class="glass-dark px-2 py-2 pr-6 rounded-full flex items-center gap-4 pointer-events-auto max-w-[70vw]">
      <button onclick="window.history.back()" class="p-3 bg-white text-black rounded-full hover:bg-gray-200 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </button>
      <div class="overflow-hidden">
        <h1 class="text-sm font-bold tracking-wide truncate">{{.FileName}}</h1>
        <p class="text-[10px] text-gray-400 uppercase tracking-widest">{{.FileSize}}</p>
      </div>
    </div>

    <div class="flex gap-3 pointer-events-auto">
      <a href="/download/{{.FileName}}" class="glass-dark p-3 rounded-full soft-btn" title="Download">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
      </a>
    </div>
  </nav>

  <main class="flex-1 w-full flex items-center justify-center p-4 sm:p-8">

    {{if .IsImage}}
      <div class="relative w-full h-full flex items-center justify-center">
        <img src="/view/{{.FileName}}?raw=true" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl drop-shadow-2xl" alt="{{.FileName}}">
      </div>

    {{else if .IsVideo}}
      <div class="w-full max-w-5xl">
        <video id="player" playsinline controls data-poster="">
            <source src="/view/{{.FileName}}?raw=true" type="{{.ContentType}}" />
        </video>
      </div>

    {{else if .IsPDF}}
      <div class="w-full h-full pt-16">
        <object data="/view/{{.FileName}}?raw=true" type="application/pdf" class="w-full h-full rounded-2xl shadow-2xl bg-white">
            <div class="flex flex-col items-center justify-center h-full text-center p-6 text-black">
                <p class="mb-4">PDF Preview requires a generic viewer.</p>
                <a href="/download/{{.FileName}}" class="px-6 py-3 bg-black text-white rounded-full">Download PDF</a>
            </div>
        </object>
      </div>

    {{else if (hasPrefix .ContentType "audio/")}}
      <div class="w-full max-w-md glass-dark p-8 rounded-[30px] flex flex-col gap-6 items-center">
        <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-gray-700 to-gray-900 flex items-center justify-center shadow-inner border border-white/10">
            <svg class="w-12 h-12 text-white/50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v11M5 19a2 2 0 100-4 2 2 0 000 4z" /></svg>
        </div>
        
        <div class="w-full">
            <audio id="player" controls>
                <source src="/view/{{.FileName}}?raw=true" type="{{.ContentType}}" />
            </audio>
        </div>
      </div>

    {{else}}
      <div class="glass-dark p-12 rounded-3xl text-center max-w-sm border border-white/10">
        <h3 class="text-lg font-bold mb-4 break-all">{{.FileName}}</h3>
        <a href="/download/{{.FileName}}" class="block w-full py-4 bg-white text-black rounded-xl font-bold hover:bg-gray-200 transition">Download File</a>
      </div>
    {{end}}

  </main>

  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize Plyr for any element with id="player"
        // This handles both the Video and Audio blocks above automatically
        const player = new Plyr('#player', {
            controls: [
                'play-large', // The large play button in the center
                'play',       // Play/pause playback
                'progress',   // The progress bar and scrubber for playback and buffering
                'current-time', // The current time of playback
                'duration',   // The full duration of the media
                'mute',       // Toggle mute
                'volume',     // Volume control
                'settings',   // Settings menu
                'pip',        // Picture-in-picture (Video only)
                'airplay',    // Airplay (Video only)
                'fullscreen'  // Toggle fullscreen (Video only)
            ],
            hideControls: true, // Auto hide controls
            keyboard: { focused: true, global: true },
            tooltips: { controls: true, seek: true }
        });
    });
  </script>
</body>
</html>
{{end}}
